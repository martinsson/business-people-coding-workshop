<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo — appeler un vrai LLM, sans clé</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:640px;
    margin:48px auto;padding:0 20px;line-height:1.6;color:#15131b;}
  h1{font-size:1.5rem;} textarea{width:100%;padding:12px;font:inherit;border:1px solid #ddd;border-radius:10px;}
  button{margin-top:10px;padding:10px 18px;font:inherit;font-weight:600;border:0;border-radius:10px;
    background:#6d3bf5;color:#fff;cursor:pointer;} button:disabled{opacity:.5;}
  pre{white-space:pre-wrap;background:#f6f4ef;border:1px solid #eee;border-radius:10px;padding:14px;margin-top:16px;}
  small{color:#6c6577;}
</style>
</head>
<body>
  <h1>Appeler un vrai LLM depuis une appli statique 🧠</h1>
  <p><small>Aucune clé API. Tape une question, clique. (Service public gratuit — peut être lent ou indisponible.)</small></p>
  <textarea id="q" rows="3">Donne-moi une idée de recette rapide avec des œufs et du riz.</textarea>
  <button id="go">Demander à l'IA</button>
  <pre id="out">—</pre>

  <script src="llm.js"></script>
  <script>
    const out = document.getElementById("out"), btn = document.getElementById("go");
    btn.addEventListener("click", async () => {
      btn.disabled = true; out.textContent = "…";
      try { out.textContent = await askLLM(document.getElementById("q").value); }
      catch (e) { out.textContent = "Erreur : " + e.message; }
      finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
